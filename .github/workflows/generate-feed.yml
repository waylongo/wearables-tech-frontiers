name: Generate Wearables Feed

on:
  schedule:
    # Target: Monday 07:30 Beijing time. GitHub may delay scheduled runs.
    - cron: "30 23 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to fetch"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - rss-only

concurrency:
  group: generate-wearables-feed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - name: Set staging directory
        run: echo "WTF_OUTPUT_DIR=$RUNNER_TEMP/wearables-feed-run" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Sync latest main
        if: github.ref_name == 'main'
        run: git pull --ff-only origin main

      - name: Generate and validate candidate feed
        id: pipeline
        continue-on-error: true
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          WTF_MODE: ${{ inputs.mode }}
        run: |
          args=("--output-dir=$WTF_OUTPUT_DIR")
          if [ "$GITHUB_REF_NAME" = "main" ]; then args+=(--publish); fi
          if [ "$WTF_MODE" = "rss-only" ]; then args+=(--rss-only); fi
          node scripts/run-feed.js "${args[@]}"

      - name: Commit feed or failure diagnostics
        id: commit
        if: always() && github.ref_name == 'main'
        run: |
          test -f "$WTF_OUTPUT_DIR/state-feed.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add feed-wearables.json state-feed.json
          git diff --cached --quiet || git commit -m "chore: update wearables feed diagnostics [skip ci]"
          git push origin HEAD:main

      - name: Write run summary and annotations
        if: always()
        env:
          WTF_PUSH_OUTCOME: ${{ steps.commit.outcome }}
        run: node scripts/run-feed.js --summary "--output-dir=$WTF_OUTPUT_DIR" "--push-outcome=$WTF_PUSH_OUTCOME"

      - name: Save candidate and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wearables-feed-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            ${{ env.WTF_OUTPUT_DIR }}/diagnostics.json
            ${{ env.WTF_OUTPUT_DIR }}/generation-report.json
            ${{ env.WTF_OUTPUT_DIR }}/quality-report.json
            ${{ env.WTF_OUTPUT_DIR }}/feed-wearables.json
            ${{ env.WTF_OUTPUT_DIR }}/candidate-state.json
            ${{ env.WTF_OUTPUT_DIR }}/state-feed.json

      - name: Preserve failed workflow status
        if: always() && (steps.pipeline.outcome != 'success' || steps.commit.outcome == 'failure')
        run: exit 1
