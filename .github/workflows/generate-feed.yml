name: Generate Wearables Feed

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to fetch"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - rss-only

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate feed
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "rss-only" ]; then
            node scripts/generate-feed.js --rss-only
          else
            node scripts/generate-feed.js
          fi

      - name: Commit and push feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed-wearables.json state-feed.json
          git diff --cached --quiet || git commit -m "chore: update wearables feed [skip ci]"
          git push
