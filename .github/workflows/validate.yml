name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check script syntax
        run: |
          node --check scripts/prepare-digest.js
          node --check scripts/generate-feed.js

      - name: Validate static artifacts
        run: |
          node <<'NODE'
          const fs = require('fs');

          const requiredFiles = [
            'README.md',
            'SKILL.md',
            'config/sources.json',
            'feed-wearables.json',
            'state-feed.json',
            'scripts/prepare-digest.js',
            'scripts/generate-feed.js',
            'prompts/digest-intro.md',
            'prompts/summarize-papers.md',
            'prompts/summarize-official.md',
            'prompts/summarize-news.md',
            'prompts/translate.md'
          ];

          for (const file of requiredFiles) {
            if (!fs.existsSync(file)) throw new Error(`Missing required file: ${file}`);
          }

          const catalog = JSON.parse(fs.readFileSync('config/sources.json', 'utf8'));
          if (catalog.schema_version == null) throw new Error('config/sources.json missing schema_version');
          if (!catalog.primary_rss || typeof catalog.primary_rss !== 'object') {
            throw new Error('config/sources.json missing primary_rss');
          }

          const ALLOWED_PRIMARY_RSS_KEYS = ['industry_news', 'company_research', 'academic', 'clinical_regulatory'];
          for (const key of Object.keys(catalog.primary_rss)) {
            if (!ALLOWED_PRIMARY_RSS_KEYS.includes(key)) {
              throw new Error(`config/sources.json primary_rss contains unsupported bucket key: ${key} (allowed: ${ALLOWED_PRIMARY_RSS_KEYS.join(', ')})`);
            }
          }

          const REMOVED_CATEGORY_IDS = new Set(['vendor_research', 'clinical_registry', 'regulatory']);
          (function walkRemovedCategories(node, path) {
            if (Array.isArray(node)) {
              for (let i = 0; i < node.length; i++) {
                walkRemovedCategories(node[i], `${path}[${i}]`);
              }
              return;
            }
            if (node && typeof node === 'object') {
              for (const [key, value] of Object.entries(node)) {
                const childPath = `${path}.${key}`;
                if ((key === 'category' || key === 'sourceCategory') && typeof value === 'string' && REMOVED_CATEGORY_IDS.has(value)) {
                  throw new Error(`config/sources.json has removed ${key} value "${value}" at ${childPath}`);
                }
                walkRemovedCategories(value, childPath);
              }
            }
          })(catalog, 'catalog');

          const feed = JSON.parse(fs.readFileSync('feed-wearables.json', 'utf8'));
          if (feed.schemaVersion == null) throw new Error('feed-wearables.json missing schemaVersion');
          if (!Array.isArray(feed.items)) throw new Error('feed-wearables.json items must be an array');
          if (!feed.healthcheck || typeof feed.healthcheck !== 'object') {
            throw new Error('feed-wearables.json missing healthcheck');
          }
          const DAY_MS = 24 * 60 * 60 * 1000;
          function parseDateMs(value) {
            if (!value) return null;
            const raw = String(value).trim();
            if (!raw) return null;
            const collapsed = raw.replace(/\s+/g, ' ');
            const candidates = [
              raw,
              collapsed,
              collapsed.replace(/(\d)([ap])\.?m\.?/gi, '$1 $2m')
            ];
            for (const candidate of candidates) {
              const ms = new Date(candidate).getTime();
              if (Number.isFinite(ms)) return ms;
            }
            return null;
          }
          const generatedAtMs = parseDateMs(feed.generatedAt);
          if (generatedAtMs == null) throw new Error('feed-wearables.json generatedAt must be parseable');
          const lookbackDays = Number(feed.lookbackDays);
          if (!Number.isFinite(lookbackDays) || lookbackDays < 1) {
            throw new Error('feed-wearables.json lookbackDays must be a positive number');
          }
          for (const item of feed.items) {
            if (item && typeof item === 'object' && typeof item.sourceCategory === 'string' && REMOVED_CATEGORY_IDS.has(item.sourceCategory)) {
              throw new Error(`feed-wearables.json item has removed sourceCategory "${item.sourceCategory}": ${item.title || item.url || '<unknown>'}`);
            }
            const itemMs = parseDateMs(item.publishedAt);
            if (itemMs == null) {
              if (item.sourceCategory === 'vendor_websearch' || item.retrievalMethod === 'tavily') continue;
              throw new Error(`Feed item has missing or invalid publishedAt: ${item.title || item.url || '<unknown>'}`);
            }
            if (itemMs > generatedAtMs + DAY_MS) throw new Error(`Feed item is dated in the future: ${item.title || item.url}`);
            if (itemMs < generatedAtMs - lookbackDays * DAY_MS) throw new Error(`Feed item is outside lookback window: ${item.title || item.url}`);
          }

          const state = JSON.parse(fs.readFileSync('state-feed.json', 'utf8'));
          if (!state || typeof state !== 'object') throw new Error('state-feed.json must be an object');
          NODE

      - name: Smoke test local fallback
        run: |
          node <<'NODE'
          const { spawnSync } = require('child_process');

          const result = spawnSync(process.execPath, [
            'scripts/prepare-digest.js',
            '--no-remote',
            '--days=30'
          ], {
            encoding: 'utf8',
            maxBuffer: 20 * 1024 * 1024
          });

          if (result.status !== 0) {
            console.error(result.stderr || result.stdout);
            process.exit(result.status || 1);
          }

          const payload = JSON.parse(result.stdout);
          if (payload.status !== 'ok') throw new Error(`Unexpected status: ${payload.status}`);
          if (payload.config?.language !== 'en') {
            throw new Error(`Expected default language en, got ${payload.config?.language}`);
          }
          if (payload.windowDays !== 30) {
            throw new Error(`Expected windowDays 30, got ${payload.windowDays}`);
          }
          if (payload.healthcheck?.feed_source !== 'local_rss') {
            throw new Error(`Expected local_rss, got ${payload.healthcheck?.feed_source}`);
          }
          if (!payload.prompts?.digest_intro) throw new Error('Missing digest_intro prompt');
          if (!Array.isArray(payload.items)) throw new Error('items must be an array');

          console.log(JSON.stringify({
            feed_source: payload.healthcheck.feed_source,
            keptItems: payload.stats?.keptItems,
            sourcesFailed: payload.stats?.sourcesFailed
          }));
          NODE

      - name: Reject invalid categories
        run: |
          node <<'NODE'
          const { spawnSync } = require('child_process');

          const result = spawnSync(process.execPath, [
            'scripts/prepare-digest.js',
            '--category=academics',
            '--days=30'
          ], {
            encoding: 'utf8',
            maxBuffer: 1024 * 1024
          });

          if (result.status === 0) {
            console.error(result.stdout);
            throw new Error('Expected invalid category to fail');
          }
          const payload = JSON.parse(result.stderr || result.stdout);
          if (!String(payload.message || '').includes('unsupported category')) {
            throw new Error(`Unexpected invalid category error: ${payload.message}`);
          }
          NODE
